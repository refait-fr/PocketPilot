name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Quality and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pocket-pilot
    env:
      E2E_CONFIGURED: ${{ secrets.E2E_CONFIRM_NON_PRODUCTION == 'true' && secrets.E2E_SUPABASE_URL != '' && secrets.E2E_SUPABASE_PUBLISHABLE_KEY != '' && secrets.E2E_SUPABASE_SERVICE_ROLE_KEY != '' && vars.E2E_MAILPIT_URL != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pocket-pilot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SITE_URL: http://localhost:3000
        run: npm run build

      - name: Install Chromium
        if: env.E2E_CONFIGURED == 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        if: env.E2E_CONFIGURED == 'true'
        env:
          E2E_CONFIRM_NON_PRODUCTION: ${{ secrets.E2E_CONFIRM_NON_PRODUCTION }}
          E2E_MAILPIT_URL: ${{ vars.E2E_MAILPIT_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
        run: npm run test:e2e

      - name: Explain skipped E2E
        if: env.E2E_CONFIGURED != 'true'
        run: echo "Playwright skipped because the dedicated non-production Supabase secrets are incomplete."

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: pocket-pilot/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
